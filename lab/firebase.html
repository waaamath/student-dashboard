<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>連線測試</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #222; }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .ok { color: #137333; } .bad { color: #c5221f; } .muted { color: #666; font-size: .9rem; }
  .big { font-size: 2rem; font-weight: 700; }
  code { font-size: .85rem; word-break: break-all; }
  ol { padding-left: 1.2em; margin: 0; }
  button { font: inherit; padding: 6px 12px; }
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<h1>影片任務 連線測試（階段 0）</h1>

<div class="card">
  <div id="signin">正在準備登入按鈕…</div>
  <ol id="steps" class="muted"></ol>
</div>

<div class="card">
  <div>後台最新一筆：<span id="seq" class="big">—</span></div>
  <div id="lag" class="muted"></div>
  <ol id="history" class="muted"></ol>
</div>

<div class="card muted">
  驗收：① 按 Google 登入後不再跳出第二個登入視窗；② 老師在 Apps Script 執行 <code>fbProtoPing</code>，上面數字在幾秒內自己變。
</div>

<div class="card">
  <strong>通行證檢查</strong>
  <div class="muted">請先以同一帳號登入原儀表板取得通行證；此頁只讀取、不發證。</div>
  <div id="access-identity" class="muted">尚未登入</div>
  <ol>
    <li>access／自己的通行證：<span id="access-check">等待登入</span></li>
    <li>catalog/_index：<span id="catalog-check">等待登入</span></li>
    <li>videos/sb1_1：<span id="videos-check">等待登入</span></li>
  </ol>
  <button id="access-recheck" disabled>重新檢查</button>
</div>

<script type="module">
// Firebase 網頁設定（公開值，把關靠安全規則）。建好專案後從「專案設定 → 你的應用程式」貼上。
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDLKj9cZ0ZM4kKlR2IUtodVnEOzsKiKB5o',
  authDomain: 'student-dashboard-513701.firebaseapp.com',
  projectId: 'student-dashboard-513701',
  appId: '1:863861496583:web:67cafde64a8351b7ca83a2',
};
const CLIENT_ID = '863861496583-i8ttdlflo03fscvcbvdc3hibqds4v7rn.apps.googleusercontent.com';

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, onSnapshot, getDocFromServer }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const $ = (id) => document.getElementById(id);
const t0 = performance.now();
const ms = () => Math.round(performance.now() - t0) + ' ms';
function step(text, cls) {
  const li = document.createElement('li');
  li.textContent = text;
  if (cls) li.className = cls;
  $('steps').appendChild(li);
}

if (!FIREBASE_CONFIG.projectId) {
  $('signin').textContent = '尚未填 Firebase 設定。';
  throw new Error('no config');
}

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
let unsub = null;
let first = true;   // 開頁第一次讀到的是舊資料，不算更新秒數

onAuthStateChanged(auth, (user) => {
  if (!user) { renderButton(); return; }
  const ids = (user.providerData || []).map((p) => p.providerId).join(', ');
  user.getIdTokenResult().then(async (r) => {
    const g = r.claims.firebase && r.claims.firebase.identities && r.claims.firebase.identities['google.com'];
    step('Firebase 已登入（' + ms() + '）　提供者：' + ids, 'ok');
    step('Google sub 讀得到：' + (g && g[0] ? '是（規則可用它當通行證鍵）' : '否'), g && g[0] ? 'ok' : 'bad');
    await checkVideoAccess(user, g && g[0]);
  }).catch(() => { $('access-identity').textContent = '無法取得登入身分，請重新登入。'; });
  $('signin').innerHTML = '';
  const b = document.createElement('button');
  b.textContent = '登出（測重新登入用）';
  b.onclick = () => { if (unsub) unsub(); signOut(auth); if (window.google) google.accounts.id.disableAutoSelect(); location.reload(); };
  $('signin').appendChild(b);
  listen();
});

function renderButton() {
  if (!window.google || !google.accounts) { setTimeout(renderButton, 200); return; }
  $('signin').textContent = '';
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: false });
  google.accounts.id.renderButton($('signin'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW', width: 280 });
}

async function onCredential(resp) {
  step('Google 登入完成（' + ms() + '）');
  try {
    await signInWithCredential(auth, GoogleAuthProvider.credential(resp.credential));
  } catch (e) {
    step('Firebase 登入失敗：' + (e.code || ''), 'bad');
  }
}

async function checkVideoAccess(user, sub) {
  const button = $('access-recheck');
  button.disabled = true;
  if (typeof sub !== 'string' || !sub) {
    $('access-identity').textContent = '無法取得 Google 身分，請重新登入。';
    return;
  }
  $('access-identity').textContent = 'Google 身分：' + sub.slice(0, 4) + '…';
  const checks = [['access-check', 'access', sub], ['catalog-check', 'catalog', '_index'], ['videos-check', 'videos', 'sb1_1']];
  checks.forEach(([id]) => { $(id).textContent = '檢查中…'; $(id).className = 'muted'; });
  // 強制讀伺服器且依序檢查，不以本機快取誤判撤權結果；不顯示文件內容或完整路徑。
  for (const [id, collection, key] of checks) {
    try {
      const snap = await getDocFromServer(doc(db, collection, key));
      if (auth.currentUser !== user) return;
      $(id).textContent = snap.exists() ? '成功' : '成功（文件不存在）';
      $(id).className = 'ok';
    } catch (e) {
      if (auth.currentUser !== user) return;
      $(id).textContent = e.code === 'permission-denied' ? '被拒' : '檢查失敗，請確認連線後重試';
      $(id).className = 'bad';
    }
  }
  button.disabled = false;
  button.onclick = () => checkVideoAccess(user, sub);
}

function listen() {
  if (unsub) return;
  unsub = onSnapshot(doc(db, 'proto', 'ping'), (snap) => {
    if (!snap.exists()) { $('seq').textContent = '（還沒有資料）'; return; }
    const d = snap.data();
    const now = new Date();
    $('seq').textContent = d.seq;
    let lag = '';
    if (first) {
      first = false;
      lag = '開頁時讀到的舊資料；之後每次執行 fbProtoPing 才算更新秒數';
    } else if (d.serverTime && d.serverTime.toDate) {
      const sec = (now - d.serverTime.toDate()) / 1000;
      lag = '寫入 ' + d.serverTime.toDate().toLocaleTimeString('zh-TW') + '，收到 ' + now.toLocaleTimeString('zh-TW')
        + '，差 ' + sec.toFixed(1) + ' 秒（手機時鐘若不準會有誤差）';
    }
    $('lag').textContent = lag;
    const li = document.createElement('li');
    li.textContent = '#' + d.seq + '　' + lag;
    $('history').prepend(li);
  }, (e) => step('讀取失敗：' + (e.code || ''), 'bad'));
}
</script>
</body>
</html>
