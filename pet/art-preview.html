<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>練習獸｜造型圖鑑</title><style>
*{box-sizing:border-box}body{margin:0;background:#111923;color:#e4e9ed;font:15px/1.7 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:32px 24px}h1,h2{font-family:Georgia,"Noto Serif TC",serif;color:#dbc08c}header p{color:#acb9c8}article{border-top:1px solid #8d785344;margin-top:28px;padding-top:12px}.forms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}figure{margin:0;border:1px solid #65708644;background:radial-gradient(ellipse at 50% 70%,#61768f33,transparent 65%),#1c2633;border-radius:10px;padding:10px;text-align:center}img{display:block;width:100%;aspect-ratio:1;object-fit:contain}figcaption{color:#c8b184}a{color:#d8c18d}header img{max-width:150px;float:right}small{color:#9aaabb}@media(max-width:650px){.forms{grid-template-columns:repeat(2,minmax(0,1fr))}header img{max-width:100px}main{padding:24px 16px}}
</style></head><body><main><header><img src="rpg/egg.png" alt="神祕蛋"><small>練習獸：數學異界</small><h1>造型圖鑑</h1><p>五種夥伴，從幼年走向最終進化。<br>26張透明角色素材，保留原有存檔的舊圖。</p><a href="guide.html">閱讀冒險指南 →</a></header><div id="gallery"></div></main><script>
const species={abyss01:'炎角龍',abyss02:'幻水狐',abyss03:'雷翼鷹',abyss04:'森靈鹿',abyss05:'鋼甲龜'},stages={young:'幼年期',growth:'成長期',battle:'戰鬥期',awaken:'覺醒期',final:'最終進化'};
for(const [id,name] of Object.entries(species)){const a=document.createElement('article'),h=document.createElement('h2'),row=document.createElement('div');h.textContent=name;row.className='forms';a.append(h,row);for(const [stage,label] of Object.entries(stages)){const f=document.createElement('figure'),img=document.createElement('img'),c=document.createElement('figcaption');img.src='rpg/'+id+'-'+stage+'-idle.png';img.alt=name+' '+label;img.loading='lazy';c.textContent=label;f.append(img,c);row.append(f)}document.getElementById('gallery').append(a)}
</script></body></html>
